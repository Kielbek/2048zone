        .page-nav a.active {
            background: var(--accent);
            color: #fff;
        }

            width: 100%;
            max-width: 760px;
            padding: 20px 20px 40px;

        .content-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 30px 34px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);

        .faq-item h3 { margin: 0 0 5px; font-size: 14.5px; color: var(--heading); }

        function pathFor(lang, page) {
            return (lang === 'en' ? '' : '/' + lang) + '/' + page;
        }
        function homeFor(lang) {
            return lang === 'en' ? '/' : '/' + lang + '/';
        }

        function setMeta(name, val, isProperty) {
            const el = document.querySelector(isProperty ? `meta[property="${name}"]` : `meta[name="${name}"]`);
            if (el) el.setAttribute('content', val);
        }

        function route() {
            const seg = location.pathname.split('/').filter(Boolean);
            let lang = 'en', page = 'privacy';
            if (seg.length && LANGS.includes(seg[0])) {
                lang = seg[0];
                if (seg.length > 1 && PAGES.includes(seg[1])) page = seg[1];
            } else if (seg.length && PAGES.includes(seg[0])) {
                page = seg[0];
            } else {
                const qp = new URLSearchParams(location.search);
                if (LANGS.includes(qp.get('lang'))) lang = qp.get('lang');
                if (PAGES.includes(qp.get('page'))) page = qp.get('page');
            }
            return { lang, page };
        }

        function render() {
            const { lang, page } = route();
            const t = content[lang] || content.en;
            const pageData = t[page];
            const isRtl = lang === 'ar';

            document.documentElement.lang = lang;
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';

            const fullTitle = `${pageData.title} – 2048zone.com`;
            const metaDescRaw = page === 'contact' ? pageData.intro : pageData.sections[0][1];
            const metaDesc = metaDescRaw.length > 158 ? metaDescRaw.slice(0, 155) + '…' : metaDescRaw;
            const canonicalUrl = `${SITE}${pathFor(lang, page)}`;

            document.title = fullTitle;
            setMeta('description', metaDesc);
            setMeta('og:title', fullTitle, true);
            setMeta('og:description', metaDesc, true);
            setMeta('og:url', canonicalUrl, true);
            const canonicalEl = document.getElementById('page-canonical');
            if (canonicalEl) canonicalEl.setAttribute('href', canonicalUrl);

            const hreflangHTML = LANGS.map(l =>
                `<link rel="alternate" hreflang="${l}" href="${SITE}${pathFor(l, page)}">`
            ).join('') + `<link rel="alternate" hreflang="x-default" href="${SITE}${pathFor('en', page)}">`;
            document.getElementById('hreflang-container').outerHTML = `<span id="hreflang-container">${hreflangHTML}</span>`;

            let jsonLd;
            if (page === 'contact') {
                jsonLd = {
                    "@context": "https://schema.org",
                    "@type": "FAQPage",
                    "mainEntity": pageData.faq.map(([q, a]) => ({
                        "@type": "Question", "name": q,
                        "acceptedAnswer": { "@type": "Answer", "text": a }
                    }))
                };
            } else {
                jsonLd = {
                    "@context": "https://schema.org",
                    "@type": "WebPage",
                    "name": pageData.title,
                    "url": canonicalUrl,
                    "inLanguage": lang,
                    "isPartOf": { "@type": "WebSite", "name": "2048zone.com", "url": SITE + "/" }
                };
            }
            document.getElementById('page-jsonld').textContent = JSON.stringify(jsonLd);

            document.getElementById('brand-link').href = homeFor(lang);
            document.getElementById('back-link').href = homeFor(lang);
            document.getElementById('back-link').textContent = t.nav.back;

            document.getElementById('page-nav').innerHTML = PAGES.map(p => {
                const cls = p === page ? ' class="active"' : '';
                return `<a href="${pathFor(lang, p)}"${cls}>${t.nav[p]}</a>`;
            }).join('');

            const select = document.getElementById('lang-select');
            select.innerHTML = LANGS.map(l => `<option value="${l}"${l === lang ? ' selected' : ''}>${LANG_NAMES[l]}</option>`).join('');
            select.onchange = () => { location.href = pathFor(select.value, page); };

            document.getElementById('heading').textContent = pageData.title;
            document.getElementById('updated-line').textContent = `${t.updated}: ${LAST_UPDATED}`;

            const textEl = document.getElementById('text-content');
            if (page === 'contact') {
                textEl.innerHTML =
                    `<p class="intro-text">${pageData.intro}</p>` +
                    `<div class="email-line">✉️ <a href="mailto:support@2048zone.com">support@2048zone.com</a></div>` +
                    `<h2 class="faq-heading">${t.faqHeading}</h2>` +
                    pageData.faq.map(([q, a]) => `<div class="faq-item"><h3>${q}</h3><p>${a}</p></div>`).join('');
            } else {
                textEl.innerHTML = pageData.sections.map(([h, p]) =>
                    `<section><h2>${h}</h2><p>${p}</p></section>`
                ).join('');
            }
        }

        render();
    </script>
